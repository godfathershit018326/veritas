name: Nachschlage-Daten bauen

on:
  workflow_dispatch:

concurrency:
  group: pattern-scanner
  cancel-in-progress: false

env:
  DATEN_REPO: ${{ github.repository_owner }}/veritas-daten

jobs:
  bauen:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/entsperren
        with:
          schluessel: ${{ secrets.GIT_CRYPT_KEY }}
      - uses: ./.github/actions/einstellungen-holen
        with:
          token: ${{ secrets.DATEN_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Abhaengigkeiten
        run: pip install requests pandas numpy scipy yfinance pyarrow openpyxl

      - name: Branchen-Zuordnung holen
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.DATEN_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Secret DATEN_TOKEN fehlt; von E2 greift nur der Namensteil."
            exit 0
          fi
          mkdir -p .cache/zuordnung
          NAME=$(gh api repos/$DATEN_REPO/contents/zuordnung --jq '[.[] | select(.type == "file") | .name | select(test("^branchen_[0-9]{4}-[0-9]{2}-[0-9]{2}[.]json$"))] | sort | reverse | .[0] // empty' 2>/dev/null || true)
          if [ -z "$NAME" ]; then
            echo "Noch keine Zuordnungsliste im Datenrepo; von E2 greift nur der Namensteil."
            exit 0
          fi
          if gh api -H "Accept: application/vnd.github.raw" "repos/$DATEN_REPO/contents/zuordnung/$NAME" > .cache/zuordnung/branchen.json; then
            echo "Zuordnungsliste geholt: $NAME"
          else
            rm -f .cache/zuordnung/branchen.json
            echo "Die Zuordnungsliste $NAME liess sich nicht holen; von E2 greift nur der Namensteil."
          fi

      - name: Rechnen 1
        run: python rs_universum.py --bauen

      - name: Rechnen 2
        run: python sektor_rangliste.py --bauen

      - name: Rechnen 3
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          DATEN_TOKEN: ${{ secrets.DATEN_TOKEN }}
        run: python ibd_ratings.py --bauen

      - name: Ins Repo legen
        run: |
          git config user.name "pattern-scanner"
          git config user.email "actions@users.noreply.github.com"
          DATEIEN="rs_universum.json sektor_rangliste.json ibd_ratings.json"
          SICHERUNG=$(mktemp -d)
          for f in $DATEIEN; do cp "$f" "$SICHERUNG/" 2>/dev/null || true; done
          for versuch in 1 2 3; do
            git fetch --quiet origin main
            git reset --hard --quiet FETCH_HEAD
            for f in $DATEIEN; do
              [ -f "$SICHERUNG/$f" ] && cp "$SICHERUNG/$f" "$f"
            done
            for f in $DATEIEN; do git add -A -- "$f" 2>/dev/null || true; done
            if git diff --cached --quiet; then
              echo "Keine Aenderung gegenueber dem Stand im Repo."
              break
            fi
            git commit -q -m "Nachschlage-Daten: RS-Universum, Sektor-Rangliste, IBD-Ratings"
            if git push --quiet origin main; then
              echo "Veroeffentlicht (Versuch $versuch)."
              break
            fi
            echo "Jemand war schneller (Versuch $versuch von 3), noch einmal."
          done

      - name: Daten für die Oberfläche
        continue-on-error: true
        run: python app_export.py nachschlagen --quelle nachschlag_daten.yml
      - uses: ./.github/actions/app-ablegen
        if: always()
        continue-on-error: true
        with:
          token: ${{ secrets.DATEN_TOKEN }}
