name: Nachrichten

on:
  schedule:
    - cron: "7 8-23 * * 1-5"
    - cron: "7 0 * * 2-6"
  workflow_dispatch:
    inputs:
      minuten:
        description: "Laufzeit in Minuten"
        default: "55"
      immer:
        description: "Auch ausserhalb des Zeitfensters (ja/nein)"
        default: "nein"

concurrency:
  group: nachrichten
  cancel-in-progress: false

permissions:
  contents: read

env:
  DATEN_REPO: ${{ github.repository_owner }}/veritas-daten

jobs:
  lesen:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/entsperren
        with:
          schluessel: ${{ secrets.GIT_CRYPT_KEY }}
      - uses: ./.github/actions/einstellungen-holen
        with:
          token: ${{ secrets.DATEN_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Daten holen
        env:
          GH_TOKEN: ${{ secrets.DATEN_TOKEN }}
        run: |
          pip install -q pandas pyarrow requests beautifulsoup4 lxml
          gh release download scanner-daten --repo "$DATEN_REPO" --pattern scanner_tabelle.parquet --clobber
          gh release download scanner-daten --repo "$DATEN_REPO" --pattern nachrichten.json --clobber \
            || echo "Noch keine Nachrichten-Datei; sie entsteht in diesem Lauf."
      - name: Lesen
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          DATEN_TOKEN: ${{ secrets.DATEN_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MINUTEN: ${{ inputs.minuten || '55' }}
          IMMER: ${{ inputs.immer || 'nein' }}
        run: |
          python nachrichten.py --minuten "$MINUTEN" --zustand nachrichten.json --tabelle scanner_tabelle.parquet \
            $([ "$IMMER" = "ja" ] && echo --immer)
      - name: Ablegen
        if: always()
        env:
          GH_TOKEN: ${{ secrets.DATEN_TOKEN }}
        run: |
          if [ -s nachrichten.json ]; then
            gh release upload scanner-daten --repo "$DATEN_REPO" nachrichten.json --clobber
            echo "Abgelegt."
          fi
