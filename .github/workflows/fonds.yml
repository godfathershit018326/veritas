name: Fonds-Kaeufe
run-name: Fonds-Kaeufe

on:
  schedule:
    - cron: "17 10 * * 0"
  workflow_dispatch:
    inputs:
      zwingend:
        description: "auch ohne neueren Datensatz rechnen (ja/nein)"
        required: false
        default: "nein"

concurrency:
  group: fonds
  cancel-in-progress: false

permissions:
  contents: read

env:
  DATEN_REPO: ${{ github.repository_owner }}/veritas-daten

jobs:
  lauf:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/entsperren
        with:
          schluessel: ${{ secrets.GIT_CRYPT_KEY }}
      - uses: actions/checkout@v5
        with:
          repository: ${{ env.DATEN_REPO }}
          token: ${{ secrets.DATEN_TOKEN }}
          path: .daten
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /app/fonds.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Vorbereitung
        env:
          GH_TOKEN: ${{ secrets.DATEN_TOKEN }}
        run: |
          pip install -q pandas pyarrow requests
          gh release download scanner-daten --repo "$DATEN_REPO" --pattern scanner_tabelle.parquet --clobber
          gh release download scanner-daten --repo "$DATEN_REPO" --pattern fonds_cusip.json --clobber || true
          if [ -f .daten/app/fonds.json ]; then cp .daten/app/fonds.json fonds.json; fi
      - name: Lauf
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          ZWINGEND: ${{ github.event.inputs.zwingend || 'nein' }}
        run: |
          if [ "$ZWINGEND" = "ja" ]; then z="--zwingend"; else z=""; fi
          python fonds.py --tabelle scanner_tabelle.parquet --alt fonds.json --cusip fonds_cusip.json --ziel fonds_neu.json $z
      - name: Ablegen
        env:
          GH_TOKEN: ${{ secrets.DATEN_TOKEN }}
        run: |
          if [ -s fonds_cusip.json ]; then gh release upload scanner-daten --repo "$DATEN_REPO" fonds_cusip.json --clobber; fi
          if [ ! -s fonds_neu.json ]; then echo "Nichts Neues."; exit 0; fi
          mkdir -p .daten/app
          cp fonds_neu.json .daten/app/fonds.json
          cd .daten
          git config user.name "veritas-fonds"
          git config user.email "actions@users.noreply.github.com"
          git add -- app/fonds.json
          if git diff --cached --quiet; then echo "Unveraendert."; exit 0; fi
          git commit -q -m "Fonds-Kaeufe"
          for versuch in 1 2 3 4 5 6; do
            if [ "$versuch" -gt 1 ]; then sleep $((RANDOM % 9 + 2)); fi
            if git push --quiet origin HEAD:main; then echo "Abgelegt (Versuch $versuch)."; exit 0; fi
            git pull --quiet --rebase origin main
          done
          echo "::error::Ablegen nach sechs Versuchen fehlgeschlagen."
          exit 1
