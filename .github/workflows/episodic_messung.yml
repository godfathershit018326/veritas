name: Episodic-Pivot-Messung
run-name: Episodic-Pivot-Messung

# Die Rueckmessung des Episodic Pivot (Mathias, 14.10.2026: "Sofort scharf,
# dazu eine Rueckmessung"): episodic_messung.py rechnet die Folgetags-Marke
# ueber die Tageskurse der letzten drei Jahre nach und die Marke ueber dem
# Eroeffnungsbereich ueber die Fuenf-Minuten-Kerzen der letzten 60
# Handelstage von Yahoo; die Zahlen-Termine der Vergangenheit kommen von
# Yahoo. Der Bericht liegt unter messungen/episodic/ im privaten Datenrepo.
# Sendet nichts, setzt keine Alarme, schreibt nichts, was Waechter, Nachtscan
# oder Mappe lesen. Das Protokoll nennt keine Kuerzel. Laeuft nur ausserhalb
# 15:30 bis 22:00 Wien.
on:
  schedule:
    - cron: "45 6 * * 6"      # Samstag 06:45 UTC, nach der Darvas-Messung
  workflow_dispatch:
    inputs:
      monate:
        description: "Messzeitraum in Monaten"
        default: "24"
      trocken:
        description: "Nur ausgeben, nichts ablegen (ja/nein)"
        default: "nein"

concurrency:
  group: episodic-messung
  cancel-in-progress: false

permissions:
  contents: read

env:
  DATEN_REPO: ${{ github.repository_owner }}/veritas-daten

jobs:
  messen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Zeitfenster pruefen
        id: fenster
        run: |
          zeit=$(TZ=Europe/Vienna date +%H%M)
          if (( 10#$zeit >= 1530 && 10#$zeit < 2200 )) && [ "$(TZ=America/New_York date +%u)" -le 5 ]; then
            echo "::notice::Handelszeit in New York: kein Lauf."
            echo "los=nein" >> "$GITHUB_OUTPUT"
          else
            echo "los=ja" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.fenster.outputs.los == 'ja'
      - uses: ./.github/actions/entsperren
        if: steps.fenster.outputs.los == 'ja'
        with:
          schluessel: ${{ secrets.GIT_CRYPT_KEY }}
      - uses: ./.github/actions/einstellungen-holen
        if: steps.fenster.outputs.los == 'ja'
        with:
          token: ${{ secrets.DATEN_TOKEN }}

      - uses: actions/checkout@v4
        if: steps.fenster.outputs.los == 'ja'
        with:
          repository: ${{ env.DATEN_REPO }}
          token: ${{ secrets.DATEN_TOKEN }}
          path: .messung
          sparse-checkout: |
            messungen/episodic

      - uses: actions/setup-python@v5
        if: steps.fenster.outputs.los == 'ja'
        with:
          python-version: "3.11"

      - name: Abhaengigkeiten
        if: steps.fenster.outputs.los == 'ja'
        run: pip install -q pandas numpy scipy pyarrow yfinance

      - name: Tageskurse holen
        if: steps.fenster.outputs.los == 'ja'
        env:
          GH_TOKEN: ${{ secrets.DATEN_TOKEN }}
        run: gh release download scanner-daten --repo "$DATEN_REPO" --pattern scanner_kurse_3j.parquet --clobber > /dev/null 2>&1 && echo "Kurse geholt." || echo "Kurse fehlen."

      - name: Messen
        if: steps.fenster.outputs.los == 'ja'
        env:
          MONATE: ${{ inputs.monate }}
        run: python episodic_messung.py --kurse scanner_kurse_3j.parquet --daten .messung --monate "${MONATE:-24}"

      - name: Ablegen
        if: steps.fenster.outputs.los == 'ja' && inputs.trocken != 'ja'
        run: |
          cd .messung
          git config user.name "veritas-episodic-messung"
          git config user.email "actions@users.noreply.github.com"
          for versuch in 1 2 3; do
            git add -A -- messungen/episodic
            if git diff --cached --quiet; then echo "Nichts abzulegen."; break; fi
            git commit -q -m "Episodic-Pivot-Messung: Rueckmessung"
            if git push --quiet origin HEAD:main; then echo "Abgelegt (Versuch $versuch)."; break; fi
            git fetch --quiet --depth=1 origin main
            git rebase --quiet FETCH_HEAD || { git rebase --abort; git reset --soft FETCH_HEAD; }
          done
