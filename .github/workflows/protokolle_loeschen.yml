name: Alte Protokolle löschen
# Loescht die Protokolle (Logs) aller Laeufe, die vor der Log-Maske vom
# 12.10.2026 liefen; darin koennen noch Kuerzel stehen. Die Laeufe selbst
# bleiben in der Liste, nur ihr Protokoll ist danach weg. Nur von Hand;
# Gerhards Ja vom 12.10.2026. Dieses Protokoll nennt nur Zahlen.
on:
  workflow_dispatch:
    inputs:
      bis:
        description: "Protokolle aller Laeufe loeschen, die vor diesem Zeitpunkt (UTC) begannen"
        required: true
        default: "2026-10-11T23:50:00Z"

concurrency:
  group: protokolle-loeschen
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  loeschen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Zeitpunkt pruefen und loeschen
        env:
          GH_TOKEN: ${{ github.token }}
          BIS: ${{ inputs.bis }}
          REPO: ${{ github.repository }}
          SELBST: ${{ github.run_id }}
        run: |
          if ! printf '%s' "$BIS" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'; then
            echo "::error::Zeitpunkt bitte als JJJJ-MM-TTTHH:MM:SSZ."
            exit 1
          fi
          gh api --paginate "repos/$REPO/actions/runs?per_page=100&created=<$BIS" --jq '.workflow_runs[].id' > laeufe.txt
          gesamt=$(wc -l < laeufe.txt); weg=0; schon=0; fehler=0
          while read -r id; do
            [ "$id" = "$SELBST" ] && continue
            if gh api -X DELETE "repos/$REPO/actions/runs/$id/logs" > /dev/null 2> antwort.txt; then
              weg=$((weg+1))
            elif grep -Eq 'HTTP (404|410)' antwort.txt; then
              schon=$((schon+1))
            else
              fehler=$((fehler+1))
            fi
          done < laeufe.txt
          echo "Laeufe vor dem Zeitpunkt: $gesamt; Protokolle geloescht: $weg; schon weg: $schon; nicht geloescht: $fehler"
          [ "$fehler" -eq 0 ]
