name: Branchen-Zuordnung bauen

on:
  workflow_dispatch:
    inputs:
      auch_unvollstaendig:
        description: "Auch bauen, wenn der Vollabzug noch nicht alle Stammaktien erledigt hat (ja/nein)"
        required: false
        default: "nein"

concurrency:
  group: branchen-zuordnung
  cancel-in-progress: false

permissions:
  contents: read

env:
  DATEN_REPO: ${{ github.repository_owner }}/veritas-daten

jobs:
  zuordnung:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Ist das Datenrepo-Token da?
        id: token
        env:
          DATEN_TOKEN: ${{ secrets.DATEN_TOKEN }}
        run: |
          if [ -z "$DATEN_TOKEN" ]; then
            echo "Secret DATEN_TOKEN fehlt; ohne Zugang zum privaten Datenrepo wird nichts gebaut."
            echo "da=nein" >> "$GITHUB_OUTPUT"
          else
            echo "da=ja" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.token.outputs.da == 'ja'
        with:
          ref: main
      - uses: ./.github/actions/entsperren
        if: steps.token.outputs.da == 'ja'
        with:
          schluessel: ${{ secrets.GIT_CRYPT_KEY }}

      - uses: actions/checkout@v5
        if: steps.token.outputs.da == 'ja'
        with:
          repository: ${{ env.DATEN_REPO }}
          token: ${{ secrets.DATEN_TOKEN }}
          path: daten

      - uses: actions/setup-python@v6
        if: steps.token.outputs.da == 'ja'
        with:
          python-version: "3.11"

      - name: Selbsttest
        if: steps.token.outputs.da == 'ja'
        run: python zuordnung_bauen.py --selbsttest

      - name: Archive des Vollabzugs holen
        if: steps.token.outputs.da == 'ja'
        env:
          GH_TOKEN: ${{ secrets.DATEN_TOKEN }}
        run: |
          mkdir -p .cache/eodhd
          python zuordnung_bauen.py --archive-liste --daten daten > .cache/archive.txt
          echo "Benoetigte Archive: $(wc -l < .cache/archive.txt)"
          while IFS='|' read -r RELEASE ARCHIV; do
            if [ -z "$ARCHIV" ]; then
              continue
            fi
            gh release download "$RELEASE" --repo "$DATEN_REPO" --pattern "$ARCHIV" --dir .cache/eodhd --clobber
          done < .cache/archive.txt
          ls -l .cache/eodhd

      - name: Liste bauen und ins Datenrepo legen
        if: steps.token.outputs.da == 'ja'
        env:
          UNVOLLSTAENDIG: ${{ github.event.inputs.auch_unvollstaendig }}
        run: |
          if [ "$UNVOLLSTAENDIG" = "ja" ]; then
            python zuordnung_bauen.py --bauen --daten daten --archive .cache/eodhd --auch-unvollstaendig
          else
            python zuordnung_bauen.py --bauen --daten daten --archive .cache/eodhd
          fi
          cd daten
          git config user.name "pattern-scanner"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- zuordnung
          if git diff --cached --quiet; then
            echo "Keine neue Zuordnungsliste."
            exit 0
          fi
          git commit -q -m "Branchen-Zuordnung: eigene Liste aus dem einmaligen Abzug (Entscheidung 10)"
          for versuch in 1 2 3; do
            if git push -q; then
              echo "Abgelegt (Versuch $versuch)."
              exit 0
            fi
            git pull -q --rebase
          done
          echo "Die Liste liess sich nach drei Anlaeufen nicht ablegen."
          exit 1
