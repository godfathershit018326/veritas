name: Lebenszeichen

on:
  workflow_dispatch:

concurrency:
  group: lebenszeichen
  cancel-in-progress: false

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/entsperren
        with:
          schluessel: ${{ secrets.GIT_CRYPT_KEY }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install requests pandas openpyxl
      - name: Lebenszeichen pruefen
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ github.token }}
          DATEN_TOKEN: ${{ secrets.DATEN_TOKEN }}
        run: python lebenszeichen.py --melden || true
