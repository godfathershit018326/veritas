name: Release-Entwurf löschen

on:
  workflow_dispatch:
    inputs:
      kennung:
        description: "Kennung des Release-Entwurfs im Datenrepo"
        required: true
        default: "409256778"

concurrency:
  group: release-entwurf-loeschen
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lauf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Entwurf prüfen und löschen
        env:
          DATEN_TOKEN: ${{ secrets.DATEN_TOKEN }}
          DATEN_REPO: ${{ github.repository_owner }}/veritas-daten
          KENNUNG: ${{ github.event.inputs.kennung }}
        run: |
          python3 - <<'EOF'
          import json, os, sys, urllib.request
          repo, token, kennung = os.environ["DATEN_REPO"], os.environ["DATEN_TOKEN"], os.environ["KENNUNG"].strip()
          if not token or not kennung.isdigit():
              print("Ohne Token oder ohne gültige Kennung wird nichts gelöscht."); sys.exit(1)
          def anfrage(pfad, methode="GET"):
              r = urllib.request.Request(f"https://api.github.com/repos/{repo}{pfad}", method=methode, headers={
                  "Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"})
              with urllib.request.urlopen(r, timeout=60) as a:
                  inhalt = a.read()
                  return a.status, (json.loads(inhalt) if inhalt else None)
          _, entwurf = anfrage(f"/releases/{kennung}")
          if not entwurf.get("draft"):
              print("Die Kennung gehört zu keinem Entwurf; nichts gelöscht."); sys.exit(1)
          tag = entwurf.get("tag_name")
          alle = []
          seite = 1
          while True:
              _, teil = anfrage(f"/releases?per_page=100&page={seite}")
              if not teil:
                  break
              alle += teil
              seite += 1
          echte = [r for r in alle if not r.get("draft") and r.get("tag_name") == tag and r.get("id") != entwurf.get("id")]
          if len(echte) != 1:
              print(f"Kein eindeutiges veröffentlichtes Release mit derselben Marke ({len(echte)}); nichts gelöscht."); sys.exit(1)
          def anhaenge(r):
              return sorted((a.get("name"), a.get("size"), a.get("digest")) for a in r.get("assets") or [])
          a_entwurf, a_echt = anhaenge(entwurf), anhaenge(echte[0])
          if not a_entwurf or a_entwurf != a_echt:
              print(f"Die Anhänge stimmen nicht überein: Entwurf {len(a_entwurf)}, Release {len(a_echt)}; nichts gelöscht."); sys.exit(1)
          groesse = sum(x[1] or 0 for x in a_entwurf)
          status, _ = anfrage(f"/releases/{kennung}", "DELETE")
          print(f"Entwurf gelöscht: Status {status}, {len(a_entwurf)} Anhänge, {groesse / 1e6:.0f} MB; das veröffentlichte Release bleibt.")
          EOF
