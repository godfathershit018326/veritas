name: Wochenrückblick

on:
  schedule:
    - cron: "15 8 * * 6"
  workflow_dispatch:
    inputs:
      senden:
        description: "Bericht ablegen und melden (ja/nein); nein zeigt ihn nur im Protokoll"
        required: false
        default: "nein"
      heute:
        description: "Lauftag JJJJ-MM-TT, leer heißt heute"
        required: false
        default: ""

concurrency:
  group: wochenrueckblick
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bericht:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/entsperren
        with:
          schluessel: ${{ secrets.GIT_CRYPT_KEY }}
      - uses: ./.github/actions/einstellungen-holen
        with:
          token: ${{ secrets.DATEN_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pandas numpy yfinance pyarrow
      - name: Daten holen
        env:
          GH_TOKEN: ${{ secrets.DATEN_TOKEN }}
          DATEN_REPO: ${{ github.repository_owner }}/veritas-daten
        run: |
          for d in scanner_tabelle.parquet scanner_kurse_3j.parquet; do
            gh release download scanner-daten --repo "$DATEN_REPO" --pattern "$d" --clobber > /dev/null 2>&1 \
              && echo "$d geholt." || echo "$d fehlt."
          done
      - name: Selbsttests
        run: |
          python berichte.py --selbsttest
          python wochenrueckblick.py --selbsttest
      - name: Wochenrückblick bauen, ablegen und melden
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DATEN_TOKEN: ${{ secrets.DATEN_TOKEN }}
          SENDEN: ${{ github.event.inputs.senden }}
          HEUTE: ${{ github.event.inputs.heute }}
          EREIGNIS: ${{ github.event_name }}
        run: |
          if [ "$EREIGNIS" = "schedule" ] || [ "$SENDEN" = "ja" ]; then
            python wochenrueckblick.py --senden ${HEUTE:+--heute "$HEUTE"} --tabelle scanner_tabelle.parquet --kurse scanner_kurse_3j.parquet
          else
            python wochenrueckblick.py --anzeigen ${HEUTE:+--heute "$HEUTE"} --tabelle scanner_tabelle.parquet --kurse scanner_kurse_3j.parquet
          fi
      - name: Daten für die Oberfläche
        if: github.event_name == 'schedule' || github.event.inputs.senden == 'ja'
        continue-on-error: true
        env:
          DATEN_TOKEN: ${{ secrets.DATEN_TOKEN }}
        run: python app_export.py woche --quelle wochenrueckblick.yml
      - uses: ./.github/actions/app-ablegen
        if: github.event_name == 'schedule' || github.event.inputs.senden == 'ja'
        continue-on-error: true
        with:
          token: ${{ secrets.DATEN_TOKEN }}
