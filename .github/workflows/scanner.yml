name: Pattern-Scanner (Kaufpunkte)

on:
  workflow_dispatch:
    inputs:
      erzwingen:
        description: "Auch scannen, wenn der fällige Scan schon geglückt ist (ja/nein)"
        required: false
        default: "nein"

concurrency:
  group: pattern-scanner
  cancel-in-progress: false

env:
  DATEN_REPO: ${{ github.repository_owner }}/veritas-daten

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 200        # 87 Ticker @ 8 Calls/min brauchen Luft
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/entsperren
        with:
          schluessel: ${{ secrets.GIT_CRYPT_KEY }}
      - uses: ./.github/actions/einstellungen-holen
        with:
          token: ${{ secrets.DATEN_TOKEN }}

      - name: Wochenputz (nach Freitag 16:02 New York, bis zur neuen Wochenliste)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DATEN_TOKEN: ${{ secrets.DATEN_TOKEN }}
        run: |
          python3 wochenputz.py
          git config user.name "pattern-scanner"
          git config user.email "actions@users.noreply.github.com"
          PUTZ="kaufpunkte_aktuell.xlsx fokusliste.json melde_gedaechtnis.json alarm_kaufpunkte.json"
          for versuch in 1 2 3; do
            for f in $PUTZ; do git add -A -- "$f" 2>/dev/null || true; done
            if git diff --cached --quiet; then
              echo "Wochenputz: nichts einzuchecken."
              break
            fi
            git commit -q -m "Wochenputz: Kaufpunkte, Alarm-Muster, Fokusliste, Melde-Gedächtnis und Einzelüberwachung der alten Woche geleert"
            if git push --quiet origin main; then
              echo "Wochenputz eingecheckt (Versuch $versuch)."
              break
            fi
            git fetch --quiet origin main
            git reset --hard --quiet FETCH_HEAD
            python3 wochenputz.py
          done
          if [ -n "$DATEN_EINSTELLUNGEN" ] && [ -f einzelaktien.csv ]; then
            hier="$PWD"
            cd "$DATEN_EINSTELLUNGEN"
            git config user.name "veritas-wochenputz"
            git config user.email "actions@users.noreply.github.com"
            for versuch in 1 2 3; do
              cp "$hier/einzelaktien.csv" einstellungen/einzelaktien.csv
              git add -A -- einstellungen/einzelaktien.csv
              if git diff --cached --quiet; then
                echo "Wochenputz: im Datenrepo nichts einzuchecken."
                break
              fi
              git commit -q -m "Wochenputz: Einzelüberwachung der alten Woche ausgetragen"
              if git push --quiet origin HEAD:main; then
                echo "Wochenputz im Datenrepo eingecheckt (Versuch $versuch)."
                break
              fi
              git fetch --quiet --depth=1 origin main
              git reset --hard --quiet FETCH_HEAD
              cp einstellungen/einzelaktien.csv "$hier/einzelaktien.csv"
              (cd "$hier" && python3 wochenputz.py > /dev/null)
            done
            cd "$hier"
          fi

      - name: Ist der fällige Scan schon erledigt?
        id: pruefung
        env:
          ERZWINGEN: ${{ github.event.inputs.erzwingen }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scan_noetig.py

      - uses: actions/setup-python@v5
        if: steps.pruefung.outputs.noetig == 'ja'
        with:
          python-version: "3.11"

      - name: Abhängigkeiten
        if: steps.pruefung.outputs.noetig == 'ja'
        run: |
          pip install requests pandas numpy scipy openpyxl yfinance pyarrow

      - name: Branchen-Zuordnung holen
        if: steps.pruefung.outputs.noetig == 'ja'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.DATEN_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Secret DATEN_TOKEN fehlt; von E2 greift nur der Namensteil."
            exit 0
          fi
          mkdir -p .cache/zuordnung
          NAME=$(gh api repos/$DATEN_REPO/contents/zuordnung --jq '[.[] | select(.type == "file") | .name | select(test("^branchen_[0-9]{4}-[0-9]{2}-[0-9]{2}[.]json$"))] | sort | reverse | .[0] // empty' 2>/dev/null || true)
          if [ -z "$NAME" ]; then
            echo "Noch keine Zuordnungsliste im Datenrepo; von E2 greift nur der Namensteil."
            exit 0
          fi
          if gh api -H "Accept: application/vnd.github.raw" "repos/$DATEN_REPO/contents/zuordnung/$NAME" > .cache/zuordnung/branchen.json; then
            echo "Zuordnungsliste geholt: $NAME"
          else
            rm -f .cache/zuordnung/branchen.json
            echo "Die Zuordnungsliste $NAME liess sich nicht holen; von E2 greift nur der Namensteil."
          fi

      - name: Scanner ausführen
        if: steps.pruefung.outputs.noetig == 'ja'
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DATEN_TOKEN: ${{ secrets.DATEN_TOKEN }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python pattern_scanner.py finviz_3.csv \
            --out kaufpunkte.xlsx \
            --rate 8

      - name: Sektor-Radar rechnen
        if: steps.pruefung.outputs.noetig == 'ja'
        continue-on-error: true
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python sektor_radar.py --bauen

      - name: Wochenregel auf die frische Mappe anwenden
        if: steps.pruefung.outputs.noetig == 'ja'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DATEN_TOKEN: ${{ secrets.DATEN_TOKEN }}
        run: python wochenputz.py --nach-scan --mappe kaufpunkte.xlsx

      - name: Excel als Artifact hochladen
        if: steps.pruefung.outputs.noetig == 'ja'
        uses: actions/upload-artifact@v4
        with:
          name: kaufpunkte
          path: kaufpunkte.xlsx
          retention-days: 1

      - name: Ergebnis für die Veritas-Anzeige veröffentlichen
        if: steps.pruefung.outputs.noetig == 'ja'
        run: |
          cp kaufpunkte.xlsx kaufpunkte_aktuell.xlsx
          git config user.name "pattern-scanner"
          git config user.email "actions@users.noreply.github.com"
          git add kaufpunkte_aktuell.xlsx
          git add -A -- sektor_radar.json 2>/dev/null || true
          git add -A -- ntfy_ids.json 2>/dev/null || true
          git add -A -- fokusliste.json 2>/dev/null || true
          git add -A -- shakeout_warteliste.json 2>/dev/null || true
          git add -A -- positionen.json 2>/dev/null || true
          git add -A -- exit_befunde.json 2>/dev/null || true
          git add -A -- volumenkurven.json 2>/dev/null || true
          git add -A -- zahlen_termine.json 2>/dev/null || true
          git add -A -- trigger_logbuch.jsonl 2>/dev/null || true
          git add -A -- ausgelassen.json 2>/dev/null || true
          for f in rs_universum.json sektor_rangliste.json ibd_ratings.json abendbericht_gedaechtnis.json schlussnahe_gemeldet.json marktampel.json; do
            git add -A -- "$f" 2>/dev/null || true
          done
          if git diff --cached --quiet; then
            echo "Keine Änderung gegenüber dem letzten Scan."
          else
            DATEIEN="kaufpunkte_aktuell.xlsx alarm_kaufpunkte.json sektor_radar.json ntfy_ids.json fokusliste.json shakeout_warteliste.json positionen.json exit_befunde.json volumenkurven.json zahlen_termine.json trigger_logbuch.jsonl ausgelassen.json rs_universum.json sektor_rangliste.json ibd_ratings.json abendbericht_gedaechtnis.json schlussnahe_gemeldet.json marktampel.json"
            SICHERUNG=$(mktemp -d)
            for f in $DATEIEN; do cp "$f" "$SICHERUNG/" 2>/dev/null || true; done
            for versuch in 1 2 3; do
              git fetch --quiet origin main
              git reset --hard --quiet FETCH_HEAD
              for f in $DATEIEN; do
                [ -f "$SICHERUNG/$f" ] && cp "$SICHERUNG/$f" "$f"
              done
              for f in $DATEIEN; do git add -A -- "$f" 2>/dev/null || true; done
              if git diff --cached --quiet; then
                echo "Nach dem Abgleich keine Änderung mehr."
                break
              fi
              git commit -q -m "Nachtscan: kaufpunkte_aktuell.xlsx aktualisiert"
              if git push --quiet origin main; then
                echo "Ergebnisse veröffentlicht (Versuch $versuch)."
                break
              fi
              echo "Jemand war schneller (Versuch $versuch von 3) - noch einmal."
            done
          fi

      - name: Daten für die Oberfläche
        if: steps.pruefung.outputs.noetig == 'ja'
        continue-on-error: true
        env:
          DATEN_TOKEN: ${{ secrets.DATEN_TOKEN }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python app_export.py scan nachschlagen --quelle scanner.yml
      - uses: ./.github/actions/app-ablegen
        if: steps.pruefung.outputs.noetig == 'ja'
        continue-on-error: true
        with:
          token: ${{ secrets.DATEN_TOKEN }}
