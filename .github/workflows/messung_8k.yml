name: Messung 8-K Vorabwerte

on:
  workflow_dispatch:
    inputs:
      hoechstens:
        description: "hoechstens so viele Faelle (Firmen)"
        required: false
        default: "30"
      modelle:
        description: "Modelle mit Beistrich getrennt (leer = alle Text-Chat-Modelle der Tagesliste)"
        required: false
        default: ""

concurrency:
  group: messung-8k
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  messung:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/entsperren
        with:
          schluessel: ${{ secrets.GIT_CRYPT_KEY }}
      - uses: ./.github/actions/einstellungen-holen
        with:
          token: ${{ secrets.DATEN_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Abhaengigkeiten
        run: pip install beautifulsoup4 lxml pandas
      - name: Selbsttest
        run: python messung_8k.py --selbsttest
      - name: Messung
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: python messung_8k.py --lauf --hoechstens "${{ inputs.hoechstens }}" --modelle "${{ inputs.modelle }}"
      - name: Antworten und Bericht als Artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: messung-8k-${{ github.run_id }}
          path: messung_8k/
          retention-days: 1
          if-no-files-found: warn
