name: Scanner-Daten bauen

on:
  workflow_run:
    workflows: ["Pattern-Scanner (Kaufpunkte)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      erzwingen:
        description: "Auch bauen, wenn die Tabelle schon mit dem neuesten RS-Universum rechnet (ja/nein)"
        required: false
        default: "nein"
      grenze:
        description: "Probelauf mit so vielen Aktien, leer heisst alle (ein Probelauf wird nicht veroeffentlicht)"
        required: false
        default: ""
      analysten:
        description: "Analystenwerte je Aktie"
        type: choice
        options:
          - rotation
          - alle
          - aus
        default: rotation

concurrency:
  group: scanner-daten
  cancel-in-progress: false

permissions:
  contents: write

env:
  DATEN_REPO: ${{ github.repository_owner }}/veritas-daten

jobs:
  bauen:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: ./.github/actions/entsperren
        with:
          schluessel: ${{ secrets.GIT_CRYPT_KEY }}
      - uses: ./.github/actions/einstellungen-holen
        with:
          token: ${{ secrets.DATEN_TOKEN }}

      - name: Fällig?
        id: pruefung
        env:
          ERZWINGEN: ${{ github.event.inputs.erzwingen }}
        run: |
          if [ "$ERZWINGEN" = "ja" ]; then
            python3 scanner_noetig.py --erzwingen
          else
            python3 scanner_noetig.py
          fi

      - uses: actions/setup-python@v5
        if: steps.pruefung.outputs.noetig == 'ja'
        with:
          python-version: "3.11"

      - name: Abhaengigkeiten
        if: steps.pruefung.outputs.noetig == 'ja'
        run: pip install requests pandas numpy scipy yfinance pyarrow openpyxl odfpy

      - name: Selbsttests
        if: steps.pruefung.outputs.noetig == 'ja'
        run: |
          python scanner_noetig.py --selbsttest
          python scanner_daten.py --selbsttest
          python scanner_ansicht.py --selbsttest

      - name: Ist das Datenrepo-Token da?
        id: token
        if: steps.pruefung.outputs.noetig == 'ja'
        env:
          DATEN_TOKEN: ${{ secrets.DATEN_TOKEN }}
        run: |
          if [ -z "$DATEN_TOKEN" ]; then
            echo "Secret DATEN_TOKEN fehlt; Analystenwerte und Kursarchiv werden nicht gesichert."
            echo "da=nein" >> "$GITHUB_OUTPUT"
          else
            echo "da=ja" >> "$GITHUB_OUTPUT"
          fi

      - name: Daten holen 1
        if: steps.pruefung.outputs.noetig == 'ja' && steps.token.outputs.da == 'ja'
        env:
          GH_TOKEN: ${{ secrets.DATEN_TOKEN }}
        run: |
          if gh release download scanner-daten --repo "$DATEN_REPO" --pattern scanner_analysten.parquet --clobber; then
            echo "Analystenwerte der Vornacht geholt."
          else
            echo "Noch keine Analystendatei im Datenrepo; die Rotation beginnt von vorn."
          fi

      - name: Daten holen 2
        if: steps.pruefung.outputs.noetig == 'ja' && steps.token.outputs.da == 'ja'
        env:
          GH_TOKEN: ${{ secrets.DATEN_TOKEN }}
        run: |
          ANZAHL=$(python -c "from config import CFG; print(CFG['konsens_kennzahlen']['schnappschuesse'])")
          mkdir -p .cache/konsens
          GEHOLT=0
          JAHRE=$(gh api repos/$DATEN_REPO/contents/konsens --jq '[.[] | select(.type == "dir") | .name] | sort | reverse | .[]' || true)
          for JAHR in $JAHRE; do
            NAMEN=$(gh api "repos/$DATEN_REPO/contents/konsens/$JAHR" --jq '[.[] | select(.type == "file") | .name | select(test("^[0-9]{4}-[0-9]{2}-[0-9]{2}_[0-9]{4}Z[.]jsonl[.]gz$"))] | sort | reverse | .[]' || true)
            for NAME in $NAMEN; do
              if [ "$GEHOLT" -ge "$ANZAHL" ]; then
                break
              fi
              if gh api -H "Accept: application/vnd.github.raw" "repos/$DATEN_REPO/contents/konsens/$JAHR/$NAME" > ".cache/konsens/$NAME"; then
                GEHOLT=$((GEHOLT + 1))
              else
                rm -f ".cache/konsens/$NAME"
              fi
            done
            if [ "$GEHOLT" -ge "$ANZAHL" ]; then
              break
            fi
          done
          echo "Einfrier-Laeufe geholt: $GEHOLT von $ANZAHL"
          ls -l .cache/konsens

      - name: Daten holen 3
        if: steps.pruefung.outputs.noetig == 'ja' && steps.token.outputs.da == 'ja'
        env:
          GH_TOKEN: ${{ secrets.DATEN_TOKEN }}
        run: |
          mkdir -p .cache/zuordnung
          NAME=$(gh api repos/$DATEN_REPO/contents/zuordnung --jq '[.[] | select(.type == "file") | .name | select(test("^branchen_[0-9]{4}-[0-9]{2}-[0-9]{2}[.]json$"))] | sort | reverse | .[0] // empty' 2>/dev/null || true)
          if [ -z "$NAME" ]; then
            echo "Noch keine Zuordnungsliste im Datenrepo; die Gruppen-RS bleibt nicht verfuegbar."
            exit 0
          fi
          if gh api -H "Accept: application/vnd.github.raw" "repos/$DATEN_REPO/contents/zuordnung/$NAME" > .cache/zuordnung/branchen.json; then
            echo "Zuordnungsliste geholt: $NAME"
            ls -l .cache/zuordnung
          else
            rm -f .cache/zuordnung/branchen.json
            echo "Die Zuordnungsliste $NAME liess sich nicht holen; die Gruppen-RS bleibt nicht verfuegbar."
          fi

      - name: Scanner-Tabelle bauen
        id: bau
        if: steps.pruefung.outputs.noetig == 'ja'
        env:
          GRENZE: ${{ github.event.inputs.grenze }}
          ANALYSTEN: ${{ github.event.inputs.analysten }}
          DATEN_TOKEN: ${{ secrets.DATEN_TOKEN }}
        run: |
          case "${ANALYSTEN:-rotation}" in
            rotation|alle|aus) ;;
            *) echo "Unbekannte Analysten-Wahl: $ANALYSTEN"; exit 1 ;;
          esac
          mkdir -p .cache/konsens .cache/zuordnung
          if [ -n "$GRENZE" ]; then
            case "$GRENZE" in
              *[!0-9]*) echo "Die Grenze muss eine ganze Zahl sein: $GRENZE"; exit 1 ;;
            esac
            python scanner_daten.py --bauen --analysten "${ANALYSTEN:-rotation}" --grenze "$GRENZE" --konsens-ordner .cache/konsens --zuordnung .cache/zuordnung/branchen.json
            echo "Probelauf mit $GRENZE Aktien: wird nicht veroeffentlicht."
            echo "veroeffentlichen=nein" >> "$GITHUB_OUTPUT"
          else
            python scanner_daten.py --bauen --analysten "${ANALYSTEN:-rotation}" --konsens-ordner .cache/konsens --zuordnung .cache/zuordnung/branchen.json
            echo "veroeffentlichen=ja" >> "$GITHUB_OUTPUT"
          fi
          ls -l scanner_tabelle.parquet scanner_analysten.parquet scanner_gruppen.json scanner_stand.json basis_stufen.json .cache/scanner/scanner_kurse_3j.parquet

      - name: Tabelle ablegen
        if: steps.bau.outputs.veroeffentlichen == 'ja' && steps.token.outputs.da == 'ja'
        env:
          GH_TOKEN: ${{ secrets.DATEN_TOKEN }}
        run: |
          if ! gh release view scanner-daten --repo "$DATEN_REPO" >/dev/null 2>&1; then
            gh release create scanner-daten --repo "$DATEN_REPO" --prerelease --latest=false \
              --title "Scanner-Daten" \
              --notes "Nachttabelle, Analystenwerte und Kursarchiv fuer den Scanner. Wird jede Nacht ersetzt."
          fi
          gh release upload scanner-daten --repo "$DATEN_REPO" scanner_tabelle.parquet scanner_stand.json --clobber

      - name: Ablegen 2
        if: steps.bau.outputs.veroeffentlichen == 'ja' && steps.token.outputs.da == 'ja'
        run: |
          if [ -z "$DATEN_EINSTELLUNGEN" ] || [ ! -f episodic_kandidaten.csv ]; then
            echo "Keine Kandidatenliste oder kein Datenrepo; nichts abzulegen."
            exit 0
          fi
          hier="$PWD"
          cd "$DATEN_EINSTELLUNGEN"
          git config user.name "veritas-scanner-daten"
          git config user.email "actions@users.noreply.github.com"
          for versuch in 1 2 3; do
            for f in episodic_kandidaten.csv hoch52_zahlen_kandidaten.csv; do
              if [ -f "$hier/$f" ]; then
                cp "$hier/$f" "einstellungen/$f"
                git add -A -- "einstellungen/$f"
              fi
            done
            if git diff --cached --quiet; then echo "Kandidatenlisten unveraendert."; break; fi
            git commit -q -m "Kandidaten des naechsten Handelstags"
            if git push --quiet origin HEAD:main; then echo "Kandidatenliste abgelegt (Versuch $versuch)."; break; fi
            git fetch --quiet --depth=1 origin main
            git reset --hard --quiet FETCH_HEAD
          done
          cd "$hier"

      - name: Bericht ablegen
        if: steps.bau.outputs.veroeffentlichen == 'ja' && steps.token.outputs.da == 'ja'
        continue-on-error: true
        env:
          DATEN_TOKEN: ${{ secrets.DATEN_TOKEN }}
        run: python rslinie_bericht.py --bauen --tabelle scanner_tabelle.parquet

      - name: Ablegen 3
        if: steps.bau.outputs.veroeffentlichen == 'ja' && steps.token.outputs.da == 'ja'
        env:
          GH_TOKEN: ${{ secrets.DATEN_TOKEN }}
        run: |
          if ! gh release view scanner-daten --repo "$DATEN_REPO" >/dev/null 2>&1; then
            gh release create scanner-daten --repo "$DATEN_REPO" --prerelease --latest=false \
              --title "Scanner-Daten" \
              --notes "Analystenwerte je Aktie und Tageskurse der letzten drei Jahre fuer den Scanner. Wird jede Nacht ersetzt."
          fi
          gh release upload scanner-daten --repo "$DATEN_REPO" \
            scanner_analysten.parquet scanner_gruppen.json .cache/scanner/scanner_kurse_3j.parquet --clobber

      - name: Ablegen 4
        if: steps.bau.outputs.veroeffentlichen == 'ja' && steps.token.outputs.da == 'ja'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.DATEN_TOKEN }}
        run: |
          if [ -f .cache/scanner/scanner_vergleich_3j.parquet ]; then
            gh release upload scanner-daten --repo "$DATEN_REPO" .cache/scanner/scanner_vergleich_3j.parquet --clobber
          else
            echo "Keine Vergleichsreihen."
          fi

      - name: Stand ins Repo legen
        if: steps.bau.outputs.veroeffentlichen == 'ja'
        run: |
          git config user.name "pattern-scanner"
          git config user.email "actions@users.noreply.github.com"
          SICHERUNG=$(mktemp -d)
          cp scanner_stand.json basis_stufen.json "$SICHERUNG/"
          ERLEDIGT=nein
          for versuch in 1 2 3; do
            git fetch --quiet origin main
            git reset --hard --quiet FETCH_HEAD
            cp "$SICHERUNG/scanner_stand.json" scanner_stand.json
            cp "$SICHERUNG/basis_stufen.json" basis_stufen.json
            git add -- scanner_stand.json basis_stufen.json
            if git diff --cached --quiet; then
              echo "Keine Aenderung gegenueber dem Stand im Repo."
              ERLEDIGT=ja
              break
            fi
            git commit -q -m "Aktualisierung"
            if git push --quiet origin main; then
              echo "Veroeffentlicht (Versuch $versuch)."
              ERLEDIGT=ja
              break
            fi
            echo "Jemand war schneller (Versuch $versuch von 3), noch einmal."
          done
          if [ "$ERLEDIGT" != "ja" ]; then
            echo "Der Stand liess sich nach drei Anlaeufen nicht ins Repo legen; der naechste Anstoss baut neu."
            exit 1
          fi

      - name: Daten für die Oberfläche
        if: steps.bau.outputs.veroeffentlichen == 'ja'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.DATEN_TOKEN }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            gh api -H "Accept: application/vnd.github.raw" "repos/$DATEN_REPO/contents/scanner_vorlagen.json" > .scanner_vorlagen.json 2>/dev/null || rm -f .scanner_vorlagen.json
          fi
          python app_export.py scanner --vorlagen .scanner_vorlagen.json --quelle scanner_daten.yml
      - uses: ./.github/actions/app-ablegen
        if: steps.bau.outputs.veroeffentlichen == 'ja'
        continue-on-error: true
        with:
          token: ${{ secrets.DATEN_TOKEN }}
